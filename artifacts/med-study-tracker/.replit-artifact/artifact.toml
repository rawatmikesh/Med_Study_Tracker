kind = "mobile"
previewPath = "/"
title = "Med Study Tracker"
description = "A mobile study companion for medical students that turns rotations and lectures into realistic study windows, tracks Step 2 topic progress, and makes daily check-ins quick."
version = "1.0.0"
id = "artifacts/med-study-tracker"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20678

[services.development]
run = "pnpm --filter @workspace/med-study-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/med-study-tracker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/med-study-tracker", "run", "serve" ]

[services.env]
PORT = "20678"
BASE_PATH = "/"
